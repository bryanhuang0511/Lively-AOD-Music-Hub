<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sci-Fi Dynamic Liquid Glass AOD Music Hub</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Core Global Audio Listener (Declared globally for Lively Wallpaper) -->
  <script src="js/audio_listener.js"></script>
</head>
<body>

  <!-- Pure Pitch-Black Background Canvas Layer (0% GPU/CPU) -->
  <canvas id="bgCanvas"></canvas>

  <!-- Central AOD Hub -->
  <main class="liquid-aod-hub" id="centerHub">
    
    <!-- 🔮 3. Liquid Glass Capsule with Dynamic Moving Specular & Audio-Reactive Google Chroma Rim -->
    <div class="liquid-glass-capsule-wrapper" id="capsuleWrapper">
      <!-- 🌟 Constant-Perimeter-Arc-Length Google Chroma Canvas Rim (等弧長、等線速、羽化彗星光芒) -->
      <canvas class="rgb-aura-canvas" id="auraCanvas"></canvas>

      <!-- Core Deep Obsidian Sci-Fi Liquid Glass Capsule Pill -->
      <header class="liquid-glass-capsule" id="glassCapsule">
        <!-- 🌟 Dynamic Moving Specular Glass Sheen Sweep -->
        <div class="liquid-specular-beam" id="specularBeam"></div>

        <!-- Song Title -->
        <span class="capsule-title" id="trackTitle">STANDBY</span>
        
        <!-- Subtle Glass Divider -->
        <span class="capsule-divider">•</span>

        <!-- Artist Name -->
        <span class="capsule-artist" id="trackArtist">AOD MUSIC HUB</span>

        <!-- Play/Pause Status Symbol Badge (Pure Symbol, No Chinese Text) -->
        <div class="capsule-status-badge" id="playStatusBadge" title="播放狀態">
          <span class="status-icon" id="statusIcon">▶</span>
        </div>
      </header>
    </div>

    <!-- 🎵 4. Silky Continuous Conveyor Lyrics Viewport -->
    <section class="lyrics-viewport" id="lyricsViewport">
      <div class="lyrics-track" id="lyricsTrack">
        <div class="lyric-line is-prev">🌌 AOD MUSIC HUB • 星空時空穿梭版</div>
        <div class="lyric-line is-active">🎵 播放音樂時自動同步歌詞與動態律動</div>
        <div class="lyric-line is-next">✨ 支援 Windows 系統全域媒體與在線搜尋</div>
      </div>
    </section>

  </main>

  <!-- JavaScript Modules -->
  <script src="js/color_thief.js"></script>
  <script src="js/starfield_engine.js"></script>
  <script src="js/lyrics_engine.js"></script>
  <script src="js/aura_beam.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
